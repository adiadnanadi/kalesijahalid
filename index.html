<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Barcode Scanner</title>
    <!-- Tailwind CSS za brutalan dizajn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome za moderne ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-QRCode knjižnica za skeniranje -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        /* Animacija lasera za skeniranje */
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .laser-line {
            animation: scan 2s linear infinite;
            background: linear-gradient(to bottom, rgba(239, 68, 68, 0), rgba(239, 68, 68, 0.8), rgba(239, 68, 68, 0));
        }
        /* Custom scrollbar za povijest */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- HEADER -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-red-500/20 p-2 rounded-lg text-red-500">
                    <i class="fa-solid fa-barcode text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">STOCK <span class="text-red-500">SCAN</span></h1>
                    <p class="text-xs text-slate-400">Google Sheets Integracija</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="connection-status" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-xs text-slate-400">Online</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-md w-full mx-auto px-4 py-6 flex flex-col justify-start gap-6">

        <!-- CAMERA SCANNER CONTAINER -->
        <div class="relative bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl shadow-black/50">
            <!-- Overlay s laserom -->
            <div id="scanner-overlay" class="absolute inset-0 pointer-events-none z-10 border-2 border-red-500/30 rounded-2xl overflow-hidden hidden">
                <div class="laser-line absolute left-0 right-0 h-1 bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.8)]"></div>
                <!-- Kutni markeri -->
                <div class="absolute top-4 left-4 w-6 h-6 border-t-4 border-l-4 border-red-500"></div>
                <div class="absolute top-4 right-4 w-6 h-6 border-t-4 border-r-4 border-red-500"></div>
                <div class="absolute bottom-4 left-4 w-6 h-6 border-b-4 border-l-4 border-red-500"></div>
                <div class="absolute bottom-4 right-4 w-6 h-6 border-b-4 border-r-4 border-red-500"></div>
            </div>

            <!-- Video element (Tu se prikazuje kamera) -->
            <div id="interactive" class="w-full aspect-square bg-black flex items-center justify-center">
                <div id="loading-message" class="text-center p-6 text-slate-400">
                    <i class="fa-solid fa-camera text-4xl mb-3 text-slate-600 animate-bounce"></i>
                    <p class="text-sm">Kamera nije pokrenuta</p>
                </div>
            </div>

            <!-- Kontrole Kamere -->
            <div class="p-4 bg-slate-900/90 border-t border-slate-800 flex justify-around items-center">
                <button id="btn-toggle-scan" class="flex-1 mx-2 bg-red-600 hover:bg-red-500 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-red-950/50">
                    <i class="fa-solid fa-play"></i> Pokreni Skener
                </button>
            </div>
        </div>

        <!-- RUČNI UNOS / REZULTAT -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Zadnje skenirano / Ručni unos</h2>
            <div class="flex gap-2">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-keyboard absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="barcode-input" placeholder="Skenirajte ili upišite..." class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
                </div>
                <button id="btn-send-manual" class="bg-slate-800 hover:bg-slate-700 text-white px-5 rounded-xl border border-slate-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- POVIJEST SKENIRANJA -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 flex-grow flex flex-col min-h-[200px]">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Povijest (Lokalno)</h2>
                <button id="btn-clear-history" class="text-xs text-slate-500 hover:text-red-400 transition">Očisti</button>
            </div>
            <div id="history-list" class="space-y-2 overflow-y-auto max-h-[180px] flex-grow pr-1 text-sm">
                <p class="text-slate-500 text-center py-6 italic">Nema povijesti skeniranja</p>
            </div>
        </div>

    </main>

    <!-- NOTIFIKACIJA (TOAST) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-800 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 translate-y-24 opacity-0 max-w-sm w-[90%]">
        <div id="toast-icon-wrapper" class="p-2 rounded-lg bg-green-500/20 text-green-500">
            <i id="toast-icon" class="fa-solid fa-check text-lg"></i>
        </div>
        <div class="flex-grow">
            <p id="toast-title" class="font-semibold text-sm">Spremljeno!</p>
            <p id="toast-desc" class="text-xs text-slate-400">Podatak poslan u Google Sheet.</p>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        // === KONFIGURACIJA ===
        const GOOGLE_SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTBslkCVOu5tbIWjet6LhTJnHLvi4iHHC9BRn0OiaqiadX1wVG2KMNBnRQdLNBvo2B4f-Wv1QI8t6Q21v99ZDdEZEqIHqzPq2v3Y7a8BYarFvXocPqRZ-a66CXEhB3lFlIcZg97HtnYeM8LH0MxMb9vb9wKTUbB5Mv6j5YgWNZJff3RS2ALYrLh5hZxgUMFDZTfePpiNPAuAbhS8FG_MjBbNml866vckMrq9bObOk6ntG4Mb6X_-ClOZ1GMRhQY0NRZekRmqzesoXTIxv2KPwot7d-cKA&lib=M41dGwpNFX3Sqkm4mWHHssO0bjbmz2opP"; // <--- OVDJE STAVI SVOJ URL!

        // Elementi sučelja
        const btnToggleScan = document.getElementById('btn-toggle-scan');
        const scannerOverlay = document.getElementById('scanner-overlay');
        const barcodeInput = document.getElementById('barcode-input');
        const btnSendManual = document.getElementById('btn-send-manual');
        const historyList = document.getElementById('history-list');
        const btnClearHistory = document.getElementById('btn-clear-history');
        const toast = document.getElementById('toast');

        let html5QrCode = null;
        let isScanning = false;
        let localHistory = JSON.parse(localStorage.getItem('scan_history') || '[]');

        // Inicijalizacija povijesti pri pokretanju
        updateHistoryUI();

        // Funkcija za zvučni signal (Beep) preko Web Audio API-ja
        function playBeep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Visoki ugodni ton
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        }

        // Vibracija mobitela
        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate(150);
            }
        }

        // Prikaz moderne obavijesti (Toast)
        function showToast(title, desc, type = 'success') {
            const iconWrapper = document.getElementById('toast-icon-wrapper');
            const icon = document.getElementById('toast-icon');
            
            if (type === 'success') {
                iconWrapper.className = 'p-2 rounded-lg bg-green-500/20 text-green-500';
                icon.className = 'fa-solid fa-check text-lg';
            } else if (type === 'loading') {
                iconWrapper.className = 'p-2 rounded-lg bg-blue-500/20 text-blue-500';
                icon.className = 'fa-solid fa-circle-notch animate-spin text-lg';
            } else {
                iconWrapper.className = 'p-2 rounded-lg bg-red-500/20 text-red-500';
                icon.className = 'fa-solid fa-triangle-exclamation text-lg';
            }

            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;

            // Prikaži toast
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (type !== 'loading') {
                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-24', 'opacity-0');
                }, 3000);
            }
        }

        function hideToast() {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('translate-y-24', 'opacity-0');
        }

        // Slanje podataka na Google Sheet
        async function sendDataToGoogleSheet(barcode, format = 'BARCODE') {
            showToast("Slanje...", "Podaci se spremaju u Google Sheet...", "loading");
            
            const payload = {
                barcode: barcode,
                format: format,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };

            try {
                // Koristimo 'no-cors' mode jer Apps Script preusmjerava zahtjeve, 
                // ali naša skripta na sheetu će svejedno spremiti podatak!
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                // Dodaj u lokalnu povijest
                addToHistory(barcode, format);
                showToast("Uspješno spremljeno!", `Kod: ${barcode}`, "success");
                barcodeInput.value = barcode;

            } catch (error) {
                console.error("Greška pri slanju:", error);
                showToast("Greška pri slanju", "Provjerite internet i URL skripte.", "error");
            }
        }

        // Pokretanje i zaustavljanje skeniranja
        async function toggleScanner() {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        }

        function startScanner() {
            document.getElementById('interactive').innerHTML = ''; // Očisti poruku
            html5QrCode = new Html5Qrcode("interactive");
            
            const config = {
                fps: 15,
                qrbox: function(width, height) {
                    // Prilagodba okvira za skeniranje (povoljno za duge barkodove)
                    return { width: Math.min(width * 0.8, 300), height: 150 };
                },
                aspectRatio: 1.0
            };

            // Pokreni stražnju kameru ("environment")
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            ).then(() => {
                isScanning = true;
                scannerOverlay.classList.remove('hidden');
                btnToggleScan.innerHTML = '<i class="fa-solid fa-stop"></i> Zaustavi Skener';
                btnToggleScan.className = "flex-1 mx-2 bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2";
            }).catch(err => {
                console.error("Kamera se ne može pokrenuti:", err);
                showToast("Greška kamere", "Dopustite pristup kameri.", "error");
                document.getElementById('interactive').innerHTML = `
                    <div class="text-center p-6 text-red-400">
                        <i class="fa-solid fa-circle-exclamation text-4xl mb-2"></i>
                        <p class="text-sm">Nije moguće pristupiti kameri.</p>
                    </div>`;
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    scannerOverlay.classList.add('hidden');
                    btnToggleScan.innerHTML = '<i class="fa-solid fa-play"></i> Pokreni Skener';
                    btnToggleScan.className = "flex-1 mx-2 bg-red-600 hover:bg-red-500 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-red-950/50";
                    document.getElementById('interactive').innerHTML = `
                        <div class="text-center p-6 text-slate-400">
                            <i class="fa-solid fa-camera text-4xl mb-3 text-slate-600 animate-bounce"></i>
                            <p class="text-sm">Kamera je zaustavljena</p>
                        </div>`;
                }).catch(err => console.error(err));
            }
        }

        // Što se dogodi kad skener prepozna kod
        function onScanSuccess(decodedText, decodedResult) {
            playBeep();
            triggerVibration();
            
            // Privremeno pauziraj skeniranje da se ne šalje više puta isti kod
            stopScanner();

            // Pošalji podatke
            sendDataToGoogleSheet(decodedText, decodedResult.result.format.formatName);

            // Restartaj skener automatski nakon 2.5 sekunde
            setTimeout(() => {
                startScanner();
            }, 2500);
        }

        // Lokalna povijest funkcije
        function addToHistory(barcode, format) {
            const time = new Date().toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' });
            localHistory.unshift({ barcode, format, time }); // Dodaj na početak
            if (localHistory.length > 20) localHistory.pop(); // Drži max 20 zapisa
            localStorage.setItem('scan_history', JSON.stringify(localHistory));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            if (localHistory.length === 0) {
                historyList.innerHTML = `<p class="text-slate-500 text-center py-6 italic">Nema povijesti skeniranja</p>`;
                return;
            }
            historyList.innerHTML = localHistory.map(item => `
                <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <p class="font-mono font-bold text-slate-200">${item.barcode}</p>
                        <p class="text-[10px] text-slate-500 uppercase">${item.format}</p>
                    </div>
                    <span class="text-xs text-slate-500">${item.time}</span>
                </div>
            `).join('');
        }

        // Ručni unos gumb
        btnSendManual.addEventListener('click', () => {
            const val = barcodeInput.value.trim();
            if (val) {
                sendDataToGoogleSheet(val, "MANUAL_ENTRY");
            } else {
                showToast("Upozorenje", "Upišite kod prije slanja.", "error");
            }
        });

        // "Enter" na tipkovnici za ručni unos
        barcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnSendManual.click();
            }
        });

        // Čišćenje povijesti
        btnClearHistory.addEventListener('click', () => {
            if (confirm("Želite li očistiti lokalnu povijest?")) {
                localHistory = [];
                localStorage.removeItem('scan_history');
                updateHistoryUI();
            }
        });

        // Event listener za pokretanje kamere
        btnToggleScan.addEventListener('click', toggleScanner);
    </script>
</body>
</html>
